<link rel="stylesheet" href="/pagefind/pagefind-component-ui.css">
<script src="/pagefind/pagefind-component-ui.js" type="module"></script>
<script type="module">await import('/pagefind/pagefind-highlight.js');new PagefindHighlight({highlightParam: 'hl'})</script>

<pagefind-config
    excerpt-length="45"
    highlight-param="hl"
    meta-cache-tag="{{ time.Now.Unix }}"
></pagefind-config>

<pagefind-modal-trigger placeholder="Search"></pagefind-modal-trigger>
<pagefind-modal></pagefind-modal>
